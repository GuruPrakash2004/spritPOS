<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Softvent vLQMS | Version 3 - Neutral Surface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --color-surface:#f5f5f2;--color-surface-raised:#fbfbf8;--color-surface-darker:#e7e7e3;
      --color-border-card:#dee2de;--color-border-pill:#e3e3e0;
      --color-ink:#262323cc;--color-ink-strongest:#262323e6;--color-ink-strong:#262323d9;--color-ink-muted:#262323b3;--color-ink-faint:#26232380;
      --color-feature-success:#34a853;--color-feature-neutral:#bfbfbf;--color-accent-brown:#a76451;--color-ink-ui-solid:#202020;
      --bg:var(--color-surface);--panel:var(--color-surface-raised);--panel-2:var(--color-surface-darker);--line:var(--color-border-card);
      --text:var(--color-ink-strongest);--muted:var(--color-ink-muted);--accent:var(--color-accent-brown);--accent-dark:#8a5142;
      --radius-md:.375rem;--radius-lg:.5rem;--radius-xl:.75rem;--radius-2xl:1rem;
      --shadow:0 1px 2px rgba(38,35,35,.06)
    }
    :root.dark{
      color-scheme:dark;
      --color-surface:#1b1b19;--color-surface-raised:#232320;--color-surface-darker:#2b2b27;
      --color-border-card:#3a3a35;--color-border-pill:#3f3f39;
      --color-ink-strongest:#f5f5f2f2;--color-ink-muted:#f5f5f280;
      --color-feature-success:#5ec780;--color-accent-brown:#c98872;
      --bg:var(--color-surface);--panel:var(--color-surface-raised);--panel-2:var(--color-surface-darker);--line:var(--color-border-card);
      --text:var(--color-ink-strongest);--muted:var(--color-ink-muted);--accent:var(--color-accent-brown);--accent-dark:#d99d89;
      --shadow:0 1px 2px rgba(0,0,0,.32)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit;font-family:inherit}
    button{cursor:pointer}
    .mono{font-family:'IBM Plex Mono',monospace}
    .eyebrow-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
    .check-row{display:flex;align-items:center;gap:8px}
    .check-dot{width:14px;height:14px;border-radius:50%;background:var(--color-feature-success);display:inline-flex;align-items:center;justify-content:center;flex:none}
    .check-dot svg{width:8px;height:8px}

    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:3}
    .brand{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    .brand-mark{width:32px;height:32px;border-radius:var(--radius-lg);background:var(--color-ink-ui-solid);color:#fff;display:grid;place-items:center;font-weight:700}
    .brand strong{display:block;font-size:13px;font-weight:600;color:var(--text)}
    .brand small{color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
    .nav{padding:14px 12px;overflow:auto;flex:1}
    .section{padding:18px 12px 6px}
    .nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px;text-align:left;font-size:12px;font-weight:500}
    .nav button:hover{background:var(--panel-2);color:var(--text)}
    .nav button.active{background:var(--panel-2);color:var(--text);border:1px solid var(--color-border-pill);font-weight:600}
    .side-foot{padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em}
    .online{color:var(--color-feature-success)}

    .shell{min-width:0;flex:1;display:flex;flex-direction:column}
    .topbar,.footer{background:var(--panel);border-color:var(--line);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
    .topbar{height:68px;padding:12px 24px;border-bottom:1px solid var(--line)}
    .topbar h1{font-size:17px;margin:0;color:var(--text);font-weight:600}
    .topbar small{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em}
    .actions{display:flex;align-items:center;gap:10px}
    .icon-btn{border:1px solid var(--color-border-pill);background:var(--panel-2);color:var(--muted);font-size:16px;padding:7px 9px;border-radius:999px}
    .icon-btn:hover{background:var(--panel-2);color:var(--text)}
    .avatar{width:30px;height:30px;border-radius:999px;background:var(--color-ink-ui-solid);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px}
    .tabs{height:44px;padding:6px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
    .tab{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border:1px solid var(--color-border-pill);border-radius:999px;background:var(--panel-2);color:var(--text);font-size:12px;font-weight:600}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .main{overflow:auto;flex:1;padding:28px}
    .footer{height:38px;border-top:1px solid var(--line);padding:0 24px;color:var(--muted);font:11px 'IBM Plex Mono',monospace}
    .footer strong{color:var(--text)}
    .mobile-menu{display:none}

    .page{max-width:1200px;margin:auto}
    .hero{padding:28px;border-radius:var(--radius-2xl);background:var(--color-ink-ui-solid);color:#fff;display:flex;justify-content:space-between;gap:20px}
    .hero h2{font-size:26px;line-height:1.15;margin:10px 0 6px;font-weight:700}
    .hero p{margin:0;color:rgba(255,255,255,.7);font-size:12px}
    .eyebrow{display:inline-block;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--color-feature-success) 18%,transparent);border:1px solid color-mix(in srgb,var(--color-feature-success) 32%,transparent);color:var(--color-feature-success);font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
    .fy{text-align:right;color:rgba(255,255,255,.55);font-size:11px}
    .fy strong{display:block;color:#fff;font:12px 'IBM Plex Mono',monospace;margin-top:4px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
    .card,.module{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-2xl);box-shadow:var(--shadow)}
    .card{padding:18px}
    .card-label{color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
    .card-value{font-size:22px;font-weight:700;margin-top:10px;letter-spacing:-.01em}
    .card-sub{color:var(--muted);font-size:11px;margin-top:3px}
    .graphs{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
    .graph{padding:20px}
    .graph h3{margin:0;font-size:14px;font-weight:600}
    .graph p{color:var(--muted);font-size:11px;margin:4px 0 20px}
    .bars{height:170px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding:0 8px}
    .bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;color:var(--muted);font-size:10px}
    .bar{width:100%;max-width:36px;background:var(--accent);border-radius:6px 6px 0 0}
    .donut{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--color-feature-success) 0 42%,#5b8def 42% 68%,#e0a640 68% 86%,#d1667e 86%);display:grid;place-items:center}
    .donut:after{content:'100%';width:66px;height:66px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:11px}
    .mix{display:flex;align-items:center;gap:20px}
    .legend{font-size:11px;display:grid;gap:8px}
    .legend span{display:flex;gap:7px;align-items:center}
    .swatch{width:8px;height:8px;border-radius:50%}
    .movement{margin-top:14px;padding:20px}
    .movement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .movement-item{border-left:2px solid var(--line);padding-left:12px}
    .movement-item small{display:block;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em}
    .movement-item strong{font-size:20px;display:block;margin:4px 0}
    .meter{height:5px;border-radius:999px;background:var(--panel-2)}
    .meter i{height:100%;display:block;border-radius:999px;background:var(--accent)}

    .module{padding:26px;max-width:900px;margin:auto}
    .module h2{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em}
    .module p{color:var(--muted);font-size:13px}
    .module table{border-collapse:collapse;width:100%;margin-top:18px}
    .module th,.module td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}
    .module th{background:var(--panel-2);color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
    .module td{font-size:13px}
    .module input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel-2);color:var(--text);margin:4px 0 14px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .save{border:0;border-radius:999px;background:var(--color-ink-ui-solid);color:#fff;padding:10px 18px;font-weight:600;font-size:13px}
    .remove{border:0;background:transparent;color:#c1554f;font-size:17px}

    .report-page{max-width:1200px;margin:auto}
    .report-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-2xl);background:var(--panel);box-shadow:var(--shadow)}
    .report-title{display:flex;align-items:center;gap:12px}
    .report-icon{width:42px;height:42px;border-radius:var(--radius-lg);background:var(--panel-2);color:var(--accent);display:grid;place-items:center;font-size:20px}
    .report-actions{display:flex;gap:8px}
    .report-actions button,.filter-actions button{border:1px solid var(--color-border-pill);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--text)}
    .report-actions button:last-child,.generate{background:var(--color-ink-ui-solid)!important;color:#fff!important;border-color:var(--color-ink-ui-solid)!important}
    .report-layout{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-top:14px;align-items:start}
    .report-tree,.report-filters{padding:20px;border:1px solid var(--line);border-radius:var(--radius-2xl);background:var(--panel);box-shadow:var(--shadow)}
    .report-group{margin-bottom:16px}
    .report-group h4{margin:0;padding:4px 8px;color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
    .report-group button{width:100%;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:var(--radius-lg);text-align:left;font-size:12px;display:flex;justify-content:space-between}
    .report-group button:hover{background:var(--panel-2);color:var(--text)}
    .report-group button.selected{background:color-mix(in srgb,var(--color-feature-success) 14%,transparent);color:var(--color-feature-success);font-weight:600;border-left:2px solid var(--color-feature-success)}
    .report-filters h3{margin:3px 0 16px;font-size:16px;font-weight:600}
    .filter-label{display:block;color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
    .filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .filter-grid select,.filter-grid input{width:100%;border:1px solid var(--line);border-radius:var(--radius-lg);padding:9px 10px;background:var(--panel-2);color:var(--text)}
    .filter-actions{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
    .filter-actions button:last-child{background:transparent;color:#c1554f;border-color:transparent}
    .filter-table{width:100%;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;border-collapse:collapse}
    .filter-table th,.filter-table td{padding:10px;text-align:left;border-bottom:1px solid var(--line);font-size:11px}
    .filter-table th{background:var(--panel-2);color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase}
    .filter-table button{border:0;background:transparent;color:var(--muted);font-size:15px}
    .filter-table td:last-child,.filter-table th:last-child{text-align:right}
    .report-footer{text-align:right;margin-top:16px}
    .generate{border:0;border-radius:999px;padding:11px 20px;font-weight:600}
    .empty{text-align:center;color:var(--muted);font-style:italic}

    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.graphs{grid-template-columns:1fr}.sidebar{width:220px;flex-basis:220px}.report-layout{grid-template-columns:1fr}.report-tree{max-height:360px;overflow:auto}}
    @media(max-width:700px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);transition:transform .25s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.main{padding:14px}.hero{padding:18px;display:block}.fy{text-align:left;margin-top:16px}.cards{gap:10px}.card{padding:13px}.card-value{font-size:19px}.movement-grid{gap:8px}.movement-item strong{font-size:18px}.footer{font-size:9px}.footer span:nth-child(2){display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">V</div><div><strong>Softvent vLQMS</strong><small>CLOUD ERP NET 8.0</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">DB: vLQMSLHOUSE <span class="online">● Online</span><br>Login: ADMIN • Bangalore-92</div>
    </aside>
    <div class="shell">
      <header class="topbar"><div class="actions"><button class="icon-btn mobile-menu" id="menu">☰</button><div><h1>THE LIQUOR HOUSE</h1><small>FY: 01/04/2026 - 31/03/2027 • CL-2 LICENSE</small></div></div><div class="actions"><button class="icon-btn" id="theme" title="Toggle theme">◐</button><div class="avatar">AD</div><span class="mono" style="font-size:11px;color:var(--muted)">ADMIN</span></div></header>
      <div class="tabs"><span class="tab"><i class="dot"></i><span id="activeTab">Dashboard</span></span></div>
      <main class="main" id="main"></main>
      <footer class="footer"><span><strong>● Ready</strong>　DB: vLQMSLHOUSE　Login: ADMIN</span><span>Licensed Copy: 827106637　 Total Bills: 142　 <strong>Today's Sales: ₹ 1,84,650.00</strong></span></footer>
    </div>
  </div>
  <script>
    const modules={Masters:['Company Master','Item Master','Item Group Master','UOM Master','Supplier Master','Customer Master','Ledger Master','Ledger Group Master','Sales Counter Master','Package Master','Brand Master'],Transactions:['Purchase Bill','Sales Invoice','Expense Entry','Stock Deduction','Purchase Indent','Sales Return'],Reports:['Stock Balance Report','Customised Reports']};
    const stock=[['VIN GREEN LABEL BARREL SPECIAL CLASIC WHISKY','WHISKY','750ml',48,24,16,56],['ROYAL CHALLENGE SELECT PREMIUM WHISKY','WHISKY','750ml',60,36,28,68],['KINGFISHER PREMIUM LAGER BEER','BEER','650ml',144,120,96,168],['OLD MONK THE LEGEND XXX RUM','RUM','750ml',36,24,18,42]];
    const reportCategories={"Expense Report":['Expense Ledger Report','Expense Report'],"Purchase Report":['1.GRN Wise Purchase Report','2.Day Wise Group Wise Purchase Report','3.Supplier Bill Wise Purchase Report','Item Wise Purchase Report-Day Wise','Item Wise Purchase Report-Bill Wise','Item Wise Purchase Report-Month Wise','ItemWise Purchase Report','MRP RATES','Purchase Report- Item Wise Summary','Purchase Report-MonthWise Summary'],"Sales Report":['1.Deleted Invoice Report','2.Sales-Item Wise Report','3.Item wise Sales Report - Bill Wise','Cancelled Invoice report','Item wise Sales Report - Day Wise','Item wise Sales Report - Month Wise','Sales - Bill Wise Report','Sales - Counter Wise Report','Sales - Day Wise Report','Sales - Group Wise Report','Sales - Hourly Report','Sales - Item Wise Report','Sales - Month Wise Report','Sales - PackageItem Wise Report','Sales - Sales Person Wise Report','Sales Other Payment','Sales Return - Day Wise Report','Sales Return Report']};
    let active='Dashboard', dark=false, purchase=[{name:'VIN GREEN LABEL WHISKY 750ML',qty:24,rate:759.29},{name:'KINGFISHER PREMIUM BEER 650ML',qty:48,rate:155}], selectedReport='Expense Ledger Report', filterOn='Exp Date', filters=[['Date Range','01/09/2026 to 21/09/2026']];
    const nav=document.querySelector('#nav'),main=document.querySelector('#main'),activeTab=document.querySelector('#activeTab');
    const check='<span class="check-dot"><svg viewBox="0 0 8 8" fill="none"><path d="M1 4l2 2 4-4" stroke="#fff" stroke-width="1.4"/></svg></span>';
    function buildNav(){nav.innerHTML='<button data-m="Dashboard">▦　Dashboard</button>'+Object.entries(modules).map(([group,items])=>`<div class="section eyebrow-label">${group}</div>${items.map(item=>`<button data-m="${item}">${icon(item)}　${item}</button>`).join('')}`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.m;render();document.querySelector('#sidebar').classList.remove('open')});}
    function icon(name){return name.includes('Report')||name==='Customised Reports'?'▥':name.includes('Purchase')?'▣':name.includes('Sales')?'▤':'◆'}
    function render(){activeTab.textContent=active;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===active));main.innerHTML=active==='Dashboard'?dashboard():active==='Customised Reports'?reportsPage():active==='Purchase Bill'?purchasePage():active==='Stock Deduction'?simple('Stock Deduction','Excise breakage, spillage, and damage adjustments.','Item: VIN GREEN LABEL BARREL SPECIAL CLASIC WHISKY 750ML • Deducted Qty: 2 Bottles • Reason: Unloading crate breakage'):active==='Expense Entry'?expense():active==='Stock Balance Report'?stockReport():generic(active);}
    function dashboard(){const bars=[112,145,128,168,154,192,185];return `<section class="page"><div class="hero"><div><span class="eyebrow">Softvent vLQMS Net 8.0</span><h2>THE LIQUOR HOUSE</h2><p>Byatarayanapura, Bangalore-92 • Karnataka Excise License CL-2</p></div><div class="fy">Financial Year<strong>01/04/2026 - 31/03/2027</strong></div></div><div class="cards">${[['Today\'s Sales','₹ 1,84,650.00','+12.4% vs yesterday'],['Bills Issued','142 Bills','Counter 1: 118 | Delivery: 24'],['Total Stock Value','₹ 24,18,500.00','1,248 Items • 14 Categories'],['Pending KSBCL Indents','2 Indents','Depot 12 • 48 Cases']].map(x=>`<article class="card"><span class="card-label">${x[0]}</span><div class="card-value">${x[1]}</div><div class="card-sub">${x[2]}</div></article>`).join('')}</div><div class="graphs"><article class="card graph"><h3>Sales performance <b style="float:right;color:var(--accent-dark);font-size:11px">+12.4%</b></h3><p>Bills value in thousands, last 7 days</p><div class="bars">${bars.map((v,i)=>`<div class="bar-wrap"><span>₹${v}k</span><i class="bar" style="height:${v/192*78}%"></i><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></article><article class="card graph"><h3>Inventory mix</h3><p>Share of current stock value</p><div class="mix"><div class="donut"></div><div class="legend"><span><i class="swatch" style="background:var(--color-feature-success)"></i>Whisky <b>42%</b></span><span><i class="swatch" style="background:#5b8def"></i>Beer <b>26%</b></span><span><i class="swatch" style="background:#e0a640"></i>Rum & Vodka <b>18%</b></span><span><i class="swatch" style="background:#d1667e"></i>Scotch <b>14%</b></span></div></div></article></div><article class="card movement"><h3>Stock movement</h3><p>Today's inventory flow across the store</p><div class="movement-grid">${[['Opening stock','1,248','88%'],['Received','+168','58%'],['Issued','-96','34%']].map(x=>`<div class="movement-item"><small>${x[0]}</small><strong>${x[1]}</strong><div class="meter"><i style="width:${x[2]}"></i></div></div>`).join('')}</div></article></section>`}
    function simple(title,desc,body){return `<section class="module"><h2>${title}</h2><p>${desc}</p><div class="card mono" style="padding:16px;font-size:12px">${body}</div></section>`}
    function expense(){return `<section class="module"><h2>Expense Entry</h2><table><thead><tr><th>Sl</th><th>Particulars / Ledger</th><th>Amount (₹)</th><th>Remarks</th></tr></thead><tbody><tr><td>1</td><td>Generator Diesel & Fuel</td><td>₹ 2,200.00</td><td>Backup power generator fuel</td></tr><tr><td>2</td><td>Shop Refreshments & Tea</td><td>₹ 450.00</td><td>Weekly staff allowance</td></tr></tbody></table></section>`}
    function stockReport(){return `<section class="module"><h2>Stock Balance Report</h2><p>Excise opening, receipt, issued and closing ledger balances.</p><table><thead><tr><th>Item</th><th>Group</th><th>Package</th><th>Opening</th><th>Closing</th></tr></thead><tbody>${stock.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[6]}</td></tr>`).join('')}</tbody></table></section>`}
    function purchasePage(){return `<section class="module"><h2>New - Purchase Bill</h2><p>Consignment procurement from R&D Distributors / KSBCL.</p><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody>${purchase.map((x,i)=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>₹ ${x.rate.toFixed(2)}</td><td>₹ ${(x.qty*x.rate).toFixed(2)}</td><td><button class="remove" onclick="removePurchase(${i})">×</button></td></tr>`).join('')}</tbody></table></section>`}
    function reportsPage(){return `<section class="report-page"><div class="report-header"><div class="report-title"><div class="report-icon">◔</div><div><h2 style="margin:0">Customised Reports Explorer</h2><p style="margin:3px 0 0">Comprehensive audit & MIS reporting across 30+ liquor modules.</p></div></div><div class="report-actions"><button onclick="alert('Email report prepared')">✉ Email Report</button><button onclick="alert('Report exported')">⇩ Export XLS</button></div></div><div class="report-layout"><aside class="report-tree">${Object.entries(reportCategories).map(([group,reports])=>`<div class="report-group"><h4>${group}</h4>${reports.map(rep=>`<button class="${selectedReport===rep?'selected':''}" onclick="selectReport('${rep.replace(/'/g,"\\'")}')"><span>${rep}</span>${selectedReport===rep?'›':''}</button>`).join('')}</div>`).join('')}</aside><section class="report-filters"><small style="color:var(--muted)">Report to be Viewed</small><h3>${selectedReport}</h3><div class="filter-grid"><label><span class="filter-label">Filter On</span><select onchange="setFilter(this.value)"><option ${filterOn==='Exp Date'?'selected':''}>Exp Date</option><option ${filterOn==='Bill Date'?'selected':''}>Bill Date</option><option ${filterOn==='Ledger Name'?'selected':''}>Ledger Name</option><option ${filterOn==='Supplier Name'?'selected':''}>Supplier Name</option><option ${filterOn==='Item Group'?'selected':''}>Item Group</option></select></label><label><span class="filter-label">From Date</span><input type="date" value="2026-09-01"></label><label><span class="filter-label">To Date</span><input type="date" value="2026-09-21"></label></div><div class="filter-actions"><button onclick="addFilter()">+ Apply Selected Filter</button><button onclick="clearFilters()">Clear All Filters</button></div><table class="filter-table"><thead><tr><th>Filtered On</th><th>Filtered Value</th><th>Action</th></tr></thead><tbody>${filters.length?filters.map((f,i)=>`<tr><td><b>${f[0]}</b></td><td>${f[1]}</td><td><button onclick="removeFilter(${i})">×</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No custom filters active (showing full period data)</td></tr>'}</tbody></table><div class="report-footer"><button class="generate" onclick="alert('Generating '+selectedReport)">◉ Generate & View Report</button></div></section></div></section>`}
    function selectReport(value){selectedReport=value;render()};function setFilter(value){filterOn=value};function addFilter(){filters.push([filterOn,'Selected Period']);render()};function removeFilter(i){filters.splice(i,1);render()};function clearFilters(){filters=[];render()}
    function generic(title){const fields=['Code','Name','Description','Phone Number','Address','Opening Balance'];return `<section class="module"><h2>${title}</h2><p>Maintain ${title.toLowerCase()} records and operational details.</p><div class="form-grid">${fields.slice(0,title.includes('Customer')?6:4).map(f=>`<label class="eyebrow-label">${f}<input placeholder="Enter ${f}..."></label>`).join('')}</div><button class="save" onclick="alert('Record saved successfully')">Save Master</button></section>`}
    function removePurchase(i){purchase.splice(i,1);render()}
    document.querySelector('#theme').onclick=()=>{dark=!dark;document.documentElement.classList.toggle('dark',dark)};document.querySelector('#menu').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');buildNav();render();
  </script>
</body>
</html>
